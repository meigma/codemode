site_name: CodeMode
site_description: Reference for bounded Starlark access to registered Go capabilities over MCP
site_url: https://meigma.github.io/codemode/
repo_name: meigma/codemode
repo_url: https://github.com/meigma/codemode
edit_uri: edit/master/docs/docs/
docs_dir: docs
site_dir: build
strict: true

theme:
  name: material
  language: en
  features:
    - content.action.edit
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Tutorial:
      - Build your first server: tutorials/first-server.md
  - How-to guides:
      - Disable capabilities: how-to/disable-capabilities.md
  - Reference:
      - Public API: reference/public-api.md
      - MCP tools: reference/mcp-tools.md
  - Explanation:
      - Security model: explanation/security-model.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - stylesheets/palette.css
