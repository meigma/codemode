contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - template-go

entrypoint:
  command: /usr/bin/template-go

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  PATH: /usr/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

archs:
  - amd64
  - arm64

annotations:
  org.opencontainers.image.title: template-go
  org.opencontainers.image.description: Meigma Go repository template application
  org.opencontainers.image.source: https://github.com/meigma/template-go
  org.opencontainers.image.licenses: Apache-2.0 OR MIT
