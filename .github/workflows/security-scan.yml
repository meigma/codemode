name: Security Scan

on:
  schedule:
    - cron: "37 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-vulnerability-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve scan metadata
        id: scan
        run: |
          {
            echo "version=security-scan-${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            echo "commit=${GITHUB_SHA}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.8
          cache: true

      - name: Build local scan image (Go + melange + apko)
        env:
          VERSION: ${{ steps.scan.outputs.version }}
          COMMIT: ${{ steps.scan.outputs.commit }}
          DATE: ${{ steps.scan.outputs.date }}
        run: |
          set -euo pipefail
          mkdir -p scan-input
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -buildid= -X main.version=$VERSION -X main.commit=$COMMIT -X main.date=$DATE" \
            -o scan-input/application ./cmd/template-go
          printf '{"version":"0.0.0"}\n' > melange-vars.json
          melange keygen melange.rsa
          melange build melange.yaml --arch x86_64 --runner docker \
            --signing-key melange.rsa --source-dir scan-input --out-dir packages \
            --vars-file melange-vars.json
          apko build apko.yaml template-go:security-scan scan.tar \
            --arch amd64 --repository-append ./packages --keyring-append ./melange.rsa.pub
          docker load < scan.tar
          docker tag template-go:security-scan-amd64 template-go:security-scan

      - name: Scan local image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: template-go:security-scan
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          hide-progress: true
          limit-severities-for-sarif: true

      - name: Upload scan results
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-results.sarif
          category: container-vulnerability-scan
